
include @AGENT_DOCS_DIR@/tokens.map.conf;
include @DOCS_SITE_DIR@/tokens.map.conf;

# Agents asking for markdown on a /docs/ HTML url get the sibling index.md.
map $http_accept $docs_md_want {
    default        0;
    "~*text/markdown" 1;
}

# /seasons is the credits service's JSON API, but it's also a link humans
# follow — browsers land on the credits hub (which renders the season) while
# JSON clients keep the API.
map $http_accept $seasons_wants_html {
    default        0;
    "~*text/html"  1;
}

# The big /play boot payloads ship as pre-built brotli sidecars (this nginx has
# no brotli module): br-capable clients get the ".br" file via an alias suffix,
# everyone else the raw file. Sidecar freshness is gated by bevy-explorer/web
# `npm run check`.
map $http_accept_encoding $br_suffix {
    default                  "";
    "~(^|[,\s])br([;,\s]|$)" ".br";
}
map $br_suffix $br_enc {
    default "";
    ".br"   br;
}

server {
    listen 5080 reuseport;
    listen 5443 ssl reuseport;
    http2 on;

    ssl_certificate     @TLS_CERT@;
    ssl_certificate_key @TLS_KEY@;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_name @SERVER_NAME@;
    client_max_body_size 25M;

    # Bare /content is the sites legal page ("Content Policy") — the exact match
    # keeps it out of the content-server prefix below, which otherwise 301s
    # /content -> /content/ -> 404.
    location = /content { proxy_pass http://cat_sites; include conf.d/_proxy.inc; }
    location /content/  { proxy_pass http://cat_content;  include conf.d/_proxy.inc; }
    location /lambdas/  { proxy_pass http://cat_content;  include conf.d/_proxy.inc; }
    location = /about   { proxy_pass http://cat_content;  include conf.d/_proxy.inc; }

    location ~ "^/explorer/0x[0-9a-fA-F]{40}/(wearables|emotes)" {
        proxy_pass http://cat_content;
        include conf.d/_proxy.inc;
        include conf.d/_cors.inc;
    }
    location /explorer/ { proxy_pass http://cat_explorer_api; include conf.d/_proxy.inc; include conf.d/_cors.inc; }
    location = /main    { proxy_pass http://cat_explorer_api; include conf.d/_proxy.inc; include conf.d/_cors.inc; }
    location = /realms      { proxy_pass http://cat_explorer_api; include conf.d/_proxy.inc; include conf.d/_cors.inc; }
    location = /hot-scenes  { proxy_pass http://cat_explorer_api; include conf.d/_proxy.inc; include conf.d/_cors.inc; }
    location = /scenes {
        include conf.d/_cors.inc;
        default_type application/json;
        return 200 '{"scenes":[],"total":0}';
    }
    location /world/ { proxy_pass http://cat_explorer_api; include conf.d/_proxy.inc; include conf.d/_cors.inc; }

    # Was a proxy to the production worlds-content-server. This node serves its
    # own worlds; a world it does not host now 404s here instead of being
    # answered by production.
    location = /world/basiccontroller.dcl.eth/about {
        proxy_pass http://cat_worlds;
        include conf.d/_proxy.inc; include conf.d/_cors.inc;
    }
    location /wcs-contents/ {
        proxy_pass http://cat_worlds/contents/;
        include conf.d/_proxy.inc; include conf.d/_cors.inc;
    }

    location /places/api/ { proxy_pass http://cat_places/api/; include conf.d/_proxy.inc; include conf.d/_cors.inc; }
    location /events/api/ { proxy_pass http://cat_events/api/; include conf.d/_proxy.inc; include conf.d/_cors.inc; }
    location /events/     { proxy_pass http://cat_events; include conf.d/_proxy.inc; include conf.d/_cors.inc; }

    location /v1/communities {
        proxy_pass http://cat_communities;
        include conf.d/_proxy.inc; include conf.d/_cors.inc;
    }
    location /v1/mutes                 { proxy_pass http://cat_communities; include conf.d/_proxy.inc; include conf.d/_cors.inc; }
    # /v1/friends + /v1/friends/{peer}/messages — out-of-world friends list + DM
    # thread (catalyrst-communities; friends gate reads the social DB, messages
    # persist in the communities DB). Prefix match covers the messages subpath.
    location /v1/friends              { proxy_pass http://cat_communities; include conf.d/_proxy.inc; include conf.d/_cors.inc; }
    location /v1/members              { proxy_pass http://cat_communities; include conf.d/_proxy.inc; include conf.d/_cors.inc; }
    location /v1/community-voice-chats { proxy_pass http://cat_communities; include conf.d/_proxy.inc; include conf.d/_cors.inc; }
    location /v1/moderation/communities { proxy_pass http://cat_communities; include conf.d/_proxy.inc; }
    location /v1/admin/communities    { proxy_pass http://cat_communities; include conf.d/_proxy.inc; }
    location /social/communities/     { proxy_pass http://cat_communities; include conf.d/_proxy.inc; }

    location /v1/collections { proxy_pass http://cat_builder; include conf.d/_proxy.inc; }
    location /v1/storage     { proxy_pass http://cat_builder; include conf.d/_proxy.inc; }
    location /v1/newsletter  { proxy_pass http://cat_builder; include conf.d/_proxy.inc; }
    location ~ "^/v1/0x[0-9a-fA-F]{40}/(collections|items)$" {
        proxy_pass http://cat_builder;
        include conf.d/_proxy.inc;
    }

    # catalyrst-registry (AB-registry). POST /entities/active + /entities/versions
    # resolve wearable/emote entity DTOs — the endpoint the June-20 player 404s
    # on after the umbrella split (naked-avatar bug leg-1). Distinct from
    # /content/entities/* (the content core); this is the unprefixed AB-registry
    # namespace. _cors.inc so web explorers can reach it cross-origin.
    location /entities/ { proxy_pass http://cat_abgen; include conf.d/_proxy.inc; include conf.d/_cors.inc; }
    # asset-bundle-registry profile routes: the explorer derives {registry}/profiles
    # from its registry base URL, so a registry base of https://<host> needs these
    # beside /entities/ (catalyrst-registry serves both route families).
    location /profiles { proxy_pass http://cat_abgen; include conf.d/_proxy.inc; include conf.d/_cors.inc; }

    # x-original-path: the trailing-slash proxy_pass strips /comms/, so the
    # upstream sees /get-server-scene-adapter while the caller signed
    # /comms/get-server-scene-adapter. catalyrst-crypto's signed_fetch_path only
    # rewrites the verified path when this header is present — without it every
    # signed request here 401s. Same reason /market/, /credits/ and
    # /world-storage/ set it.
    location /comms/ {
        proxy_pass http://cat_comms/;
        include conf.d/_proxy.inc; include conf.d/_cors.inc;
        proxy_set_header x-original-path $request_uri;
    }
    # social-rpc (catalyrst-social-rpc, :5149). The explorer dials the BARE path
    # /social-rpc (no trailing slash) — a "location /social-rpc/" would 301 the
    # bare path and the client retry-loops. Prefix match + rewrite strips it.
    location /social-rpc {
        rewrite ^/social-rpc/?(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:5149;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        include conf.d/_proxy.inc;
        proxy_set_header x-original-path $request_uri;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location /ws {
        proxy_pass http://cat_archipelago;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        include conf.d/_proxy.inc;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location /rtc {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        include conf.d/_proxy.inc;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    # catalyrst-scene-state (:5209): authoritative SDK7 scene WS (/scene-state/ws/{scene})
    # + /ping /status, prefix stripped. Admin surface stays loopback-only (404 at the edge).
    location /scene-state/admin {
        return 404;
    }
    location /scene-state/ {
        proxy_pass http://127.0.0.1:5209/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        include conf.d/_proxy.inc;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /market/ {
        proxy_pass http://cat_market/;
        include conf.d/_proxy.inc;
        include conf.d/_cors.inc;
        proxy_set_header x-original-path $request_uri;
    }

    location /abgen/ { proxy_pass http://cat_abgen/; include conf.d/_proxy.inc; }

    # Imposter zip supply (catalyrst-bvimposters). Same-origin mount for the COI
    # /play deploy: the service sends no CORS/CORP headers itself, so the explorer
    # fetches it on its own origin and these edge headers cover the COEP checks.
    # Prefix-strip per umbrella/docs/bvimposters.md section 3 (/bvimposters/
    # imposters/... -> /imposters/...).
    location /bvimposters/ {
        proxy_pass http://cat_bvimposters/;
        include conf.d/_proxy.inc;
        include conf.d/_cors.inc;
        add_header Cross-Origin-Resource-Policy same-origin always;
    }

    # Prefix-strip mount for the telemetry dashboard. The trailing slash on
    # proxy_pass strips /telemetry/, so the root-mounted crate (api_router() in
    # catalyrst-telemetry/src/main.rs) sees /, /dash/*, /events, ... . Safe now
    # that base-path support landed: the crate injects <base href> + window.__BASE__
    # from TELEMETRY_BASE_PATH and the dashboard SPA builds every fetch/nav URL
    # under that prefix, so the stripped mount round-trips instead of 404ing or
    # misnavigating to the unrelated /events (cat_events) API. STAGED: also set
    # TELEMETRY_BASE_PATH=/telemetry in the telemetry env + restart the service
    # before the human-gated reload (see lore restart-requests).
    location /telemetry/ { proxy_pass http://cat_telemetry/; include conf.d/_proxy.inc; }

    # catalyrst-governance read API (api_router() in catalyrst-governance/src/lib.rs:29-44:
    # /proposals, /proposals/{id}/votes, /proposals/{id}/comments, /votes/engagement,
    # /activity, /projects, /projects/{id}, /budgets, /vestings, /members). All of it is
    # public — read.rs has no auth extractor of any kind — so no header plumbing is needed.
    # The one write path, POST /proposals/{kind}, is NOT exposed here: it is reached
    # server-side via GOVERNANCE_SUBMIT_URL from the sites action, which forwards the
    # caller's auth-chain headers for write.rs:55-69 to verify. Do not add it to the edge.
    #
    # Mounted at /governance-api/ and deliberately NOT under /governance/, because
    # /governance/* is the sites app's own page space: /governance/proposals,
    # /governance/proposals/{id}, /governance/projects and /governance/projects/{id} are
    # SSR'd HTML routes (sites packages/routes/app/routes/governance.proposals.tsx,
    # governance.proposals_.$id.tsx, governance.projects.tsx, governance.projects_.$id.tsx).
    # A "location /governance/proposals" here would shadow the human page with JSON on the
    # same URL. Prefix-strip per the /telemetry/ and /abgen/ pattern: /governance-api/budgets
    # -> /budgets on the root-mounted crate.
    #
    # STAGED: point the sites reader at this mount (GOVERNANCE_READ_URL in umbrella/env/
    # sites.env) before relying on it. Today sites reaches the crate through
    # GOVERNANCE_API_URL, a value set on the deployed host that exists in no file under
    # deploy/, nixos/, umbrella/ or rig/ — so it bypasses nginx entirely and the working
    # deployment is not reproducible from this repo.
    location /governance-api/ { proxy_pass http://cat_governance/; include conf.d/_proxy.inc; }

    # Legacy exact mounts, kept for callers that already use them (sites'
    # governance/debug-console.ts reads /governance/budgets). They squat in the sites page
    # space and survive only because no route file claims those two slugs; prefer
    # /governance-api/ for anything new.
    location /governance/budgets { proxy_pass http://cat_governance/budgets; include conf.d/_proxy.inc; }
    location /governance/health  { proxy_pass http://cat_governance/health;  include conf.d/_proxy.inc; }
    location /presence/   { proxy_pass http://cat_presence/;   include conf.d/_proxy.inc; }
    location /price/      { proxy_pass http://cat_price/;     include conf.d/_proxy.inc; }

    location /world-storage/ {
        proxy_pass http://cat_world_storage/;
        include conf.d/_proxy.inc;
        proxy_set_header x-original-path $request_uri;
    }


    location /notifications { proxy_pass http://cat_notifications; include conf.d/_proxy.inc; include conf.d/_cors.inc; }
    location /subscription  { proxy_pass http://cat_notifications; include conf.d/_proxy.inc; include conf.d/_cors.inc; }
    location = /set-email   { proxy_pass http://cat_notifications; include conf.d/_proxy.inc; }
    location = /confirm-email { proxy_pass http://cat_notifications; include conf.d/_proxy.inc; }

    location = /categories { proxy_pass http://cat_badges; include conf.d/_proxy.inc; include conf.d/_cors.inc; }
    location /badges/      { proxy_pass http://cat_badges; include conf.d/_proxy.inc; include conf.d/_cors.inc; }
    location /users/       { proxy_pass http://cat_badges; include conf.d/_proxy.inc; include conf.d/_cors.inc; }

    location = /users   { proxy_pass http://cat_credits; include conf.d/_proxy.inc; }
    location /seasons   {
        if ($seasons_wants_html) { return 302 /marketplace/credits; }
        proxy_pass http://cat_credits; include conf.d/_proxy.inc;
    }
    location /credits/  {
        proxy_pass http://cat_credits/;
        include conf.d/_proxy.inc;
        include conf.d/_cors.inc;
        proxy_set_header x-original-path $request_uri;
    }

    location /v1/transactions  { proxy_pass http://cat_economy; include conf.d/_proxy.inc; }
    location /v1/contracts/    { proxy_pass http://cat_economy; include conf.d/_proxy.inc; }
    location /v1/admin/relayer { proxy_pass http://cat_economy; include conf.d/_proxy.inc; }
    # Pay-with-MANA rail: public config/nonce reads for the checkout pane
    # (verify stays internal — credits calls economy on localhost).
    location /v1/payments/     { proxy_pass http://cat_economy; include conf.d/_proxy.inc; include conf.d/_cors.inc; }

    location = /translate { proxy_pass http://cat_media; include conf.d/_proxy.inc; }
    location = /convert   { proxy_pass http://cat_media; include conf.d/_proxy.inc; }
    location /media/      { proxy_pass http://cat_media; include conf.d/_proxy.inc; }

    location = /ui { return 301 /ui/; }
    # Slashless forms fall through to the /ui/ storybook alias and 404 there.
    location = /ui/tour  { return 301 /ui/tour/; }
    location = /ui/tours { return 301 /ui/tours/; }
    # Screen tour: raw static snapshots (also surfaced as Tours/ pages inside the
    # storybook itself). More-specific prefix wins over /ui/.
    location /ui/tour/ {
        alias /home/dcl/one/tools/screen-tour/out/;
        index index.html;
    }
    # Versioned, dated, per-product screen tours: /ui/tours/{YYYY-MM-DD}-{product}-v0/.
    # Static snapshots from the mutable working tree; autoindex lists what's published.
    location /ui/tours/ {
        alias /home/dcl/one/tools/screen-tour/tours/;
        index index.html;
        autoindex on;
    }
    # /ui/ serves the STATIC storybook build (render-nginx.sh writes _ui-serve.inc
    # as an alias). Never the :5006 dev proxy: dev vite injects root-absolute
    # /@vite/... URLs that escape the /ui/ prefix, so canvases never render there.
    # Publish via `npm run build-storybook` rsync-swap; HMR is direct on :5006.
    location /ui/ {
        include conf.d/_ui-serve.inc;
    }

    location = /llms.txt {
        alias @AGENT_DOCS_DIR@/llms.txt;
        default_type text/plain;
        charset utf-8;
        add_header Link "</llms.txt>; rel=\"llms\"" always;
        add_header x-markdown-tokens $agent_md_tokens always;
    }
    location = /llms-full.txt {
        alias @AGENT_DOCS_DIR@/llms-full.txt;
        default_type text/plain;
        charset utf-8;
        add_header x-markdown-tokens $agent_md_tokens always;
    }
    location = /openapi.yaml {
        alias @AGENT_DOCS_DIR@/openapi.yaml;
        default_type application/yaml;
        charset utf-8;
    }
    # /docs/ hosts TWO markdown corpora that share the prefix:
    #   1. the vendored docs.decentraland.org developer docs (under space dirs) — HTML
    #      for browsers, raw markdown for agents (built by ~/one/docs-site/build.sh).
    #   2. this node's own reference docs (flat *.md + parity/*.md + openapi.yaml),
    #      generated by gen-agent-docs.sh and linked from /llms.txt.
    # Regex order matters: the DCL-spaces markdown rule is listed FIRST so agent
    # markdown for the developer docs never falls into the node-docs artifact.

    # (1) developer-doc raw markdown for agents — /docs/<space>/…/index.md
    location ~ "^/docs/((?:player|creator|contributor|apis|ai-sdk-context)/.+\.md)$" {
        alias @DOCS_SITE_DIR@/$1;
        default_type text/markdown;
        charset_types text/markdown;
        charset utf-8;
        add_header Vary Accept always;
        add_header x-markdown-tokens $docs_md_tokens always;
    }
    # developer-doc landing markdown (exact match wins over the node-docs regex)
    location = /docs/index.md {
        alias @DOCS_SITE_DIR@/index.md;
        default_type text/markdown;
        charset_types text/markdown;
        charset utf-8;
        add_header Vary Accept always;
        add_header x-markdown-tokens $docs_md_tokens always;
    }
    # /docs/openapi.yaml stays a node artifact (exact match)
    location = /docs/openapi.yaml {
        alias @AGENT_DOCS_DIR@/docs/openapi.yaml;
        default_type application/yaml;
        charset utf-8;
    }
    # (2) node reference docs: single-segment *.md and parity/*.md only
    location ~ "^/docs/(?<agent_doc>parity/[^/]+\.md|[^/]+\.md)$" {
        alias @AGENT_DOCS_DIR@/docs/$agent_doc;
        default_type text/markdown;
        charset utf-8;
        add_header x-markdown-tokens $agent_md_tokens always;
    }

    # developer documentation site (static mirror of docs.decentraland.org) —
    # HTML for browsers; Accept: text/markdown internally rewrites to index.md.
    location = /docs { return 301 /docs/; }
    location /docs/ {
        alias @DOCS_SITE_DIR@/;
        index index.html;
        charset utf-8;
        # Same URL negotiates HTML vs markdown by Accept, so caches must vary on it.
        add_header Vary Accept always;
        if ($docs_md_want) { rewrite "^(.+?)/?$" $1/index.md last; }
        try_files $uri $uri/index.html =404;
        autoindex off;
    }

    location /satellite/ {
        proxy_pass http://cat_map;
        include conf.d/_proxy.inc;
        include conf.d/_cors.inc;
        access_log off;
    }

    location /camera-reel/ {
        proxy_pass http://cat_camera_reel/;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Max-Age;
        include conf.d/_proxy.inc;
        include conf.d/_cors.inc;
        proxy_set_header x-original-path $request_uri;
        client_max_body_size 25M;
    }

    location = /v1/minimap.png { proxy_pass http://cat_map; include conf.d/_proxy.inc; include conf.d/_cors.inc; }
    location = /v1/map.png     { proxy_pass http://cat_map; include conf.d/_proxy.inc; include conf.d/_cors.inc; }
    location = /v2/map.png     { proxy_pass http://cat_map; include conf.d/_proxy.inc; include conf.d/_cors.inc; }
    location = /v1/tiles       { proxy_pass http://cat_map; include conf.d/_proxy.inc; include conf.d/_cors.inc; }
    location = /v2/tiles       { proxy_pass http://cat_map; include conf.d/_proxy.inc; include conf.d/_cors.inc; }

    # Per-asset map images. lambdas_land.rs rewrites the api.decentraland.org
    # prefix squid stores on lands[].image onto LAND_IMAGE_BASE_URL, so these
    # paths must resolve on the public origin — a browser fetches them directly.
    # Without them the rewrite only moves the failure from an unreachable host
    # to a reachable 404.
    location /v1/parcels/ { proxy_pass http://cat_map; include conf.d/_proxy.inc; include conf.d/_cors.inc; }
    location /v2/parcels/ { proxy_pass http://cat_map; include conf.d/_proxy.inc; include conf.d/_cors.inc; }
    location /v1/estates/ { proxy_pass http://cat_map; include conf.d/_proxy.inc; include conf.d/_cors.inc; }
    location /v2/estates/ { proxy_pass http://cat_map; include conf.d/_proxy.inc; include conf.d/_cors.inc; }

    # Sign-in request lifecycle: served by our own catalyrst-explorer-api
    # (auth_api.rs), which registers these under an /auth prefix. Longest-prefix
    # match wins, so everything else under /auth-api/ still proxies upstream —
    # we implement neither /simulations (Tenderly) nor /accounts nor /onboarding,
    # and identities are deliberately left upstream (long-lived state).
    location = /auth-api/requests {
        proxy_pass http://cat_explorer_api/auth/requests;
        include conf.d/_proxy.inc; include conf.d/_cors.inc;
    }
    location /auth-api/requests/ {
        proxy_pass http://cat_explorer_api/auth/requests/;
        include conf.d/_proxy.inc; include conf.d/_cors.inc;
    }
    location /auth-api/v2/requests/ {
        proxy_pass http://cat_explorer_api/auth/v2/requests/;
        include conf.d/_proxy.inc; include conf.d/_cors.inc;
    }
    # /auth/requests is served by cat_explorer_api above. The rest of the
    # auth-api surface (identities, /simulations, /onboarding) has no local
    # implementation, so it fails closed rather than reaching production.
    location /auth-api/ {
        include conf.d/_cors.inc;
        default_type application/json;
        return 501 '{"error":"not implemented on this node","detail":"only /auth-api/requests is served locally; the remaining auth-api surface has no local implementation and this node does not proxy to production"}';
    }
    # cat_abgen is this node's asset-bundle registry (it already serves the
    # /entities/ and /profiles route families above). Pointing /abr/ at the
    # production registry meant entities deployed here were never resolved.
    location /abr/ {
        proxy_pass http://cat_abgen/;
        include conf.d/_proxy.inc; include conf.d/_cors.inc;
    }
    location /opensea/ {
        include conf.d/_cors.inc;
        default_type application/json;
        return 501 '{"error":"not implemented on this node","detail":"the OpenSea bridge has no local implementation and this node does not proxy to production"}';
    }
    # cat_builder implements the collection/item and storage-content routes.
    # Anything outside that surface 404s locally instead of hitting production.
    location /builder-api/ {
        proxy_pass http://cat_builder/;
        include conf.d/_proxy.inc; include conf.d/_cors.inc;
    }
    location /builder-items/ {
        include conf.d/_cors.inc;
        default_type application/json;
        return 501 '{"error":"not implemented on this node","detail":"the builder asset-pack bucket is not mirrored locally and this node does not proxy to production"}';
    }
    location /renderer-artifacts/ {
        include conf.d/_cors.inc;
        default_type application/json;
        return 501 '{"error":"not implemented on this node","detail":"renderer artifacts are not mirrored locally and this node does not proxy to production"}';
    }


    location = /_play { return 308 /_play/; }
    location /_play/ {
        alias @BEVY_WEB_DIR@/;
        index index.html;
        disable_symlinks off;
        try_files $uri $uri/ =404;

        # Stable-name default: store but revalidate on every use (cheap etag
        # 304s, never stale). The wasm/bundle names never change across deploys,
        # so anything cacheable-by-name would pin a browser to a dead build; the
        # hashed/pinned artifacts below opt back into immutable caching. The
        # /play/ block further down mirrors this one exactly.
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy   same-origin    always;
        add_header Cross-Origin-Embedder-Policy credentialless always;
        add_header Cross-Origin-Resource-Policy cross-origin   always;

        # Hashed / version-pinned artifacts (vite [name]-[hash] chunks, pinned
        # vendor libs) -> safe to cache forever. add_header is not inherited
        # once a level declares its own, hence the repeated Cross-Origin trio.
        location ~ ^/_play/(?<play_pinned>(?:ui3-overlay/chunks|vendor)/.+)$ {
            alias @BEVY_WEB_DIR@/$play_pinned;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Cross-Origin-Opener-Policy   same-origin    always;
            add_header Cross-Origin-Embedder-Policy credentialless always;
            add_header Cross-Origin-Resource-Policy cross-origin   always;
        }

        location ~ ^/_play/(?<play_wasm>pkg/webgpu_build_bg\.wasm)$ {
            alias @BEVY_WEB_DIR@/$play_wasm$br_suffix;
            types {}
            default_type application/wasm;
            include conf.d/_play_br.inc;
        }
        location ~ ^/_play/(?<play_bin>assets_bundle\.bin)$ {
            alias @BEVY_WEB_DIR@/$play_bin$br_suffix;
            include conf.d/_play_br.inc;
        }
    }

    # Clean public alias for the explorer: dcl.one/play == the /_play surface
    # (same bevy web dir + cross-origin isolation), so play can live on the main
    # domain instead of a separate dcl.one/play origin. Mirrors /_play/ exactly.
    location = /play { return 308 /play/; }
    location /play/ {
        alias @BEVY_WEB_DIR@/;
        index index.html;
        disable_symlinks off;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy   same-origin    always;
        add_header Cross-Origin-Embedder-Policy credentialless always;
        add_header Cross-Origin-Resource-Policy cross-origin   always;
        location ~ ^/play/(?<play2_pinned>(?:ui3-overlay/chunks|vendor)/.+)$ {
            alias @BEVY_WEB_DIR@/$play2_pinned;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Cross-Origin-Opener-Policy   same-origin    always;
            add_header Cross-Origin-Embedder-Policy credentialless always;
            add_header Cross-Origin-Resource-Policy cross-origin   always;
        }

        location ~ ^/play/(?<play2_wasm>pkg/webgpu_build_bg\.wasm)$ {
            alias @BEVY_WEB_DIR@/$play2_wasm$br_suffix;
            types {}
            default_type application/wasm;
            include conf.d/_play_br.inc;
        }
        location ~ ^/play/(?<play2_bin>assets_bundle\.bin)$ {
            alias @BEVY_WEB_DIR@/$play2_bin$br_suffix;
            include conf.d/_play_br.inc;
        }
    }

    # Instance-supplied overlay mounts (scope=overlay per catalyrst/deploy/
    # SCOPE.md — operator extras, not the realm product). The instance drops
    # location blocks into config/nginx/conf.d/_overlay-mounts.inc; a fresh
    # realm supplies none and render-nginx.sh synthesizes an empty include.
    include conf.d/_overlay-mounts.inc;

    # The vite dev server (:5158) doesn't serve public/ static files (a react-router
    # v7 dev quirk — the SSR catch-all shadows vite's static middleware), so favicon
    # + /assets/* 404'd site-wide behind the CDP-flaky smoke. Serve them straight from
    # catalyrst/sites/public/ here, falling back to the SSR proxy for anything not on disk. This
    # keeps the HMR dev-serve intact (dev chunks live under /@fs,/@vite,/@id — never
    # /assets/ — so this can't shadow them) and needs no prod-bundle switch.
    location = /favicon.ico {
        root /home/dcl/one/catalyrst/sites/public;
        try_files /favicon.ico @sites_ssr;
    }
    location /assets/ {
        root /home/dcl/one/catalyrst/sites/public;
        try_files $uri @sites_ssr;
    }
    location @sites_ssr {
        proxy_pass http://cat_sites;
        include conf.d/_proxy.inc;
    }

    location / {
        proxy_pass http://cat_sites;
        include conf.d/_proxy.inc;
        # WebSocket upgrade so Vite's HMR client (ws to the sites dev server)
        # connects through the TLS front — true hot-repaint, not reload-only SSR.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Cache policy: dev -> no-store (every working-tree edit live immediately);
        # prod -> nothing here, so react-router-serve's own headers pass through
        # (it no-stores the per-session sid-cookie'd HTML and immutable-caches its
        # hashed /assets). render-nginx writes _sites-cache.inc from the :5006 probe.
        include conf.d/_sites-cache.inc;
    }
}
