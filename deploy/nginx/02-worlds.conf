
server {
    listen 5080;
    listen 5443 ssl;
    http2 on;

    ssl_certificate     @TLS_CERT@;
    ssl_certificate_key @TLS_KEY@;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_name worlds.@SERVER_NAME@ worlds.dcl.one;
    client_max_body_size 25M;

    location / {
        proxy_pass http://cat_worlds;
        include conf.d/_proxy.inc;
        include conf.d/_cors.inc;
    }
}
