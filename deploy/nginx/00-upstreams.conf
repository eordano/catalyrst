# Overlay upstreams (metabase, bvwebgpu, editor-scene, project-realm,
# abgen-compare) are instance-supplied: config/nginx/conf.d/03-overlay-upstreams.conf.

# External is ALWAYS https (behind the saturn TLS front); the front->umbrella
# :5080 hop is plain http, so $scheme is http and the front sends no
# X-Forwarded-Proto — which leaked http:// + insecure ws:// into editor URLs.
map $http_x_forwarded_proto $ext_scheme {
    default https;
    https   https;
    http    http;
}

map $http_x_forwarded_proto $ext_ws_scheme {
    default wss;
    https   wss;
    http    ws;
}

# Pick X-Forwarded-Host (or Host if absent), then STRIP the :port. The saturn
# front forwards Host/X-Forwarded-Host WITH its internal :5080 upstream port,
# which leaked into every editor URL (http://catalyst.dcl.one:5080/_project/...).
# Traced in docs/testing/redirect-5080-trace-2026-07-06/ROOT-CAUSE.md.
map $http_x_forwarded_host $xfh_or_host {
    ''      $http_host;
    default $http_x_forwarded_host;
}
map $xfh_or_host $ext_host {
    "~^(?<h>[^:]+)" $h;
    default        $xfh_or_host;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
