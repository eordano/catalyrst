# Include inside the existing site server {}. Do not create a competing vhost.
location = /chat { return 308 /chat/; }
location = /chat/api/image {
    limit_req zone=dcl_social_images burst=120 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:5191/api/image;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    proxy_next_upstream off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
}
location ^~ /chat/ {
    limit_req zone=dcl_social burst=30 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:5191/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    # Never retry a signed write against another server.
    proxy_next_upstream off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
}
