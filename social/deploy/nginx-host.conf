# Optional hostname variant for the existing nginx behind its TLS edge.
# Include inside http {} after nginx-http.conf. Enable ONLY hostnames whose DNS
# and edge certificate/Host forwarding have been verified.
server {
    listen 5080;
    server_name chat.example.com dcl.social;
    location = /api/image {
        limit_req zone=dcl_social_images burst=120 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5191;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
        proxy_next_upstream off;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }
    location / {
        limit_req zone=dcl_social burst=30 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:5191;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
        proxy_next_upstream off;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }
}
