# Include once inside nginx's http {} block. Both entry points share the limit.
limit_req_zone $binary_remote_addr zone=dcl_social:10m rate=10r/s;
# A page of posters or avatars arrives as one burst; it must not spend the API's budget.
limit_req_zone $binary_remote_addr zone=dcl_social_images:10m rate=30r/s;
