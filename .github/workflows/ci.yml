name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  toolchain-consistency:
    name: toolchain pin is single-sourced
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          if [ -z "$channel" ]; then
            echo "::error::could not read channel from rust-toolchain.toml"
            exit 1
          fi
          echo "rust-toolchain.toml channel: $channel"
          bad=0
          while read -r pinned; do
            if [ "$pinned" != "$channel" ]; then
              echo "::error::.github/workflows/ci.yml pins toolchain \"$pinned\" but rust-toolchain.toml says \"$channel\""
              bad=1
            fi
          done < <(sed -n 's/^ *toolchain: *"\(.*\)"/\1/p' .github/workflows/ci.yml)
          if grep -qE 'rust-bin\.stable\."[0-9]' flake.nix; then
            echo "::error::flake.nix hardcodes a rust-bin.stable version; it must use fromRustupToolchainFile ./rust-toolchain.toml"
            bad=1
          fi
          exit $bad

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable @ 2026-07-08
        with:
          toolchain: "1.97.0"
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable @ 2026-07-08
        with:
          toolchain: "1.97.0"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings

  build-test:
    name: build + test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CATALYRST_TEST_PG: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable @ 2026-07-08
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace --lib --features catalyrst-fuzz/loom

  contract-gate:
    name: contract gate (events/places/worlds)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CATALYRST_EVENTS_TEST_PG: postgres://postgres:postgres@localhost:5432/postgres
      CATALYRST_PLACES_TEST_PG: postgres://postgres:postgres@localhost:5432/postgres
      CATALYRST_WORLDS_TEST_PG: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable @ 2026-07-08
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo test --test contract_gate
        run: |
          set -o pipefail
          cargo test -p catalyrst-events -p catalyrst-places -p catalyrst-worlds \
            --test contract_gate -- --nocapture 2>&1 | tee contract-gate.log
          if grep -qE '^SKIPPED |skipping .* contract gate' contract-gate.log; then
            echo "::error::contract gate skipped instead of running -- CATALYRST_*_TEST_PG unreachable"
            exit 1
          fi

  sqlx-prepare-check:
    name: sqlx offline query data (.sqlx)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable @ 2026-07-08
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
          fi
      - name: apply catalyrst-server migrations
        run: |
          for f in crates/catalyrst-server/migrations/*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - run: cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features postgres
      - name: cargo sqlx prepare --check
        run: cd crates/catalyrst-server && cargo sqlx prepare --check -- --all-targets

  security-regression:
    name: authorization-scoping regressions
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CATALYRST_COMMS_TEST_PG: postgres://postgres:postgres@localhost:5432/postgres
      CATALYRST_ECONOMY_TEST_PG: postgres://postgres:postgres@localhost:5432/postgres
      CATALYRST_PLACES_TEST_PG: postgres://postgres:postgres@localhost:5432/postgres
      CATALYRST_SOCIAL_SERVICE_TEST_PG: postgres://postgres:postgres@localhost:5432/postgres
      CATALYRST_WORLDS_TEST_PG: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable @ 2026-07-08
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
      - name: cargo test (cross-tenant write regressions)
        run: |
          set -o pipefail
          : > security-regression.log
          run() { cargo test "$@" -- --nocapture 2>&1 | tee -a security-regression.log; }
          run -p catalyrst-archipelago --test heartbeat_presence_spoof
          run -p catalyrst-comms --test server_scene_adapter_auth
          run -p catalyrst-comms --test mls_group_community_binding
          run -p catalyrst-comms --test voice_auth_fail_closed
          run -p catalyrst-economy --test meta_tx_sender_binding
          run -p catalyrst-places --test report_upload_authz
          run -p catalyrst-social-service --test cross_community_writes
          run -p catalyrst-worlds --test deploy_owner_escalation
          if grep -qE '^SKIPPED |^skipping ' security-regression.log; then
            echo "::error::authorization-scoping regressions skipped instead of running -- CATALYRST_*_TEST_PG unreachable"
            exit 1
          fi

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  nix-build:
    name: nix build .#catalyrst
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix build .#catalyrst --no-link --print-build-logs
