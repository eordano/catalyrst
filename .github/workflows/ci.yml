name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# All third-party actions are pinned to their full commit SHA to defeat
# tag-moving / maintainer-account-compromise supply-chain attacks. The
# trailing comment is the human-readable tag the SHA corresponded to at
# pin time; dependabot (see .github/dependabot.yml) bumps both the SHA
# and the comment via PR.

jobs:
  # rust-toolchain.toml is the single source of the Rust version: rustup honours it
  # for every cargo invocation here, and flake.nix feeds it to
  # rust-bin.fromRustupToolchainFile so `nix develop .#ci` gets the same compiler.
  # The toolchain: inputs below only preinstall it, so this job fails the build if
  # one of them drifts away from the file. A local rustfmt one patch release ahead
  # of CI reformats ~26 files CI is happy with, which is why this is gated.
  toolchain-consistency:
    name: toolchain pin is single-sourced
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          if [ -z "$channel" ]; then
            echo "::error::could not read channel from rust-toolchain.toml"
            exit 1
          fi
          echo "rust-toolchain.toml channel: $channel"
          bad=0
          while read -r pinned; do
            if [ "$pinned" != "$channel" ]; then
              echo "::error::.github/workflows/ci.yml pins toolchain \"$pinned\" but rust-toolchain.toml says \"$channel\""
              bad=1
            fi
          done < <(sed -n 's/^ *toolchain: *"\(.*\)"/\1/p' .github/workflows/ci.yml)
          if grep -qE 'rust-bin\.stable\."[0-9]' flake.nix; then
            echo "::error::flake.nix hardcodes a rust-bin.stable version; it must use fromRustupToolchainFile ./rust-toolchain.toml"
            bad=1
          fi
          exit $bad

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable @ 2026-07-08
        with:
          toolchain: "1.97.0"
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable @ 2026-07-08
        with:
          toolchain: "1.97.0"
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # prost-build (archipelago/social-rpc/pulse/quests build.rs) shells out
      # to protoc, which the ubuntu-latest image does not ship.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings

  build-test:
    name: build + test
    runs-on: ubuntu-latest
    # Debuginfo off: a cold `--all-targets` build otherwise exhausts the runner's memory/disk while linking.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable @ 2026-07-08
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # prost-build (archipelago/social-rpc/pulse/quests build.rs) shells out
      # to protoc, which the ubuntu-latest image does not ship.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
      - run: cargo build --workspace --all-targets
      # catalyrst-fuzz's testgate guard fails a plain run: without the loom
      # feature its five interleaving models compile to nothing and the suite
      # would report green having proven nothing. CI runs the real models.
      - run: cargo test --workspace --lib --features catalyrst-fuzz/loom

  contract-gate:
    name: contract gate (events/places/worlds)
    runs-on: ubuntu-latest
    # `cargo test --workspace --lib` above never builds tests/contract_gate.rs
    # (it's an integration test, not a lib test), so this is the only place
    # the route-level OpenAPI contract gate runs on GitHub; everywhere else it
    # is pre-commit-hook + devshell only. See catalyrst/docs/openapi-contracts.md.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CATALYRST_EVENTS_TEST_PG: postgres://postgres:postgres@localhost:5432/postgres
      CATALYRST_PLACES_TEST_PG: postgres://postgres:postgres@localhost:5432/postgres
      CATALYRST_WORLDS_TEST_PG: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable @ 2026-07-08
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # ScratchDb/ScratchSchema (crates/catalyrst-contract-gate/src/pg.rs) route
      # an unreachable CATALYRST_<CRATE>_TEST_PG through catalyrst-testgate,
      # which panics while the opt-out is unset and prints a SKIPPED line when
      # it is set. --nocapture forces that line to print even on a passing run,
      # so the grep below can catch a suite that asserted nothing. The marker is
      # SKIPPED, not "skipping" - see crates/catalyrst-testgate/src/lib.rs.
      - name: cargo test --test contract_gate
        run: |
          set -o pipefail
          cargo test -p catalyrst-events -p catalyrst-places -p catalyrst-worlds \
            --test contract_gate -- --nocapture 2>&1 | tee contract-gate.log
          if grep -qE '^SKIPPED |skipping .* contract gate' contract-gate.log; then
            echo "::error::contract gate skipped instead of running — CATALYRST_*_TEST_PG unreachable"
            exit 1
          fi

  security-regression:
    name: authorization-scoping regressions
    runs-on: ubuntu-latest
    # `cargo test --workspace --lib` in build-test runs lib tests only, so these
    # integration tests compile there but never execute. This job is the only
    # place the cross-tenant write regressions run. See docs/authz-confusion-defense.md.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CATALYRST_COMMS_TEST_PG: postgres://postgres:postgres@localhost:5432/postgres
      CATALYRST_ECONOMY_TEST_PG: postgres://postgres:postgres@localhost:5432/postgres
      CATALYRST_PLACES_TEST_PG: postgres://postgres:postgres@localhost:5432/postgres
      CATALYRST_SOCIAL_SERVICE_TEST_PG: postgres://postgres:postgres@localhost:5432/postgres
      CATALYRST_WORLDS_TEST_PG: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable @ 2026-07-08
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # prost-build (archipelago/social-rpc/pulse/quests build.rs) shells out
      # to protoc, which the ubuntu-latest image does not ship.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
      # These tests hand an unmet CATALYRST_<CRATE>_TEST_PG to catalyrst-testgate,
      # which panics while the opt-out is unset and prints a SKIPPED line when it
      # is set. --nocapture forces that line to print on a passing run so the grep
      # below can fail the build on it.
      - name: cargo test (cross-tenant write regressions)
        run: |
          set -o pipefail
          : > security-regression.log
          run() { cargo test "$@" -- --nocapture 2>&1 | tee -a security-regression.log; }
          run -p catalyrst-archipelago --test heartbeat_presence_spoof
          run -p catalyrst-comms --test server_scene_adapter_auth
          run -p catalyrst-comms --test mls_group_community_binding
          run -p catalyrst-comms --test voice_auth_fail_closed
          run -p catalyrst-economy --test meta_tx_sender_binding
          run -p catalyrst-places --test report_upload_authz
          run -p catalyrst-social-service --test cross_community_writes
          run -p catalyrst-worlds --test deploy_owner_escalation
          if grep -qE '^SKIPPED |^skipping ' security-regression.log; then
            echo "::error::authorization-scoping regressions skipped instead of running — CATALYRST_*_TEST_PG unreachable"
            exit 1
          fi

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  nix-build:
    name: nix build .#catalyrst
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix build .#catalyrst --no-link --print-build-logs
