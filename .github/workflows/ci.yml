name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# All third-party actions are pinned to their full commit SHA to defeat
# tag-moving / maintainer-account-compromise supply-chain attacks. The
# trailing comment is the human-readable tag the SHA corresponded to at
# pin time; dependabot (see .github/dependabot.yml) bumps both the SHA
# and the comment via PR.

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable @ 2026-07-08
        with:
          toolchain: "1.97.0"
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable @ 2026-07-08
        with:
          toolchain: "1.97.0"
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # prost-build (archipelago/social-rpc/pulse/quests build.rs) shells out
      # to protoc, which the ubuntu-latest image does not ship.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings

  build-test:
    name: build + test
    runs-on: ubuntu-latest
    # Debuginfo off: a cold `--all-targets` build otherwise exhausts the runner's memory/disk while linking.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable @ 2026-07-08
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # prost-build (archipelago/social-rpc/pulse/quests build.rs) shells out
      # to protoc, which the ubuntu-latest image does not ship.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace --lib

  contract-gate:
    name: contract gate (events/places/worlds)
    runs-on: ubuntu-latest
    # `cargo test --workspace --lib` above never builds tests/contract_gate.rs
    # (it's an integration test, not a lib test), so this is the only place
    # the route-level OpenAPI contract gate runs on GitHub; everywhere else it
    # is pre-commit-hook + devshell only. See catalyrst/docs/openapi-contracts.md.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CATALYRST_EVENTS_TEST_PG: postgres://postgres:postgres@localhost:5432/postgres
      CATALYRST_PLACES_TEST_PG: postgres://postgres:postgres@localhost:5432/postgres
      CATALYRST_WORLDS_TEST_PG: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable @ 2026-07-08
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # ScratchDb/ScratchSchema (crates/catalyrst-contract-gate/src/pg.rs) skip
      # silently when CATALYRST_<CRATE>_TEST_PG is unset OR unreachable, so a
      # broken service here would otherwise pass green without testing
      # anything. --nocapture forces the skip eprintln to print even on a
      # passing run, so the grep below can catch that failure mode.
      - name: cargo test --test contract_gate
        run: |
          set -o pipefail
          cargo test -p catalyrst-events -p catalyrst-places -p catalyrst-worlds \
            --test contract_gate -- --nocapture 2>&1 | tee contract-gate.log
          if grep -q "skipping .* contract gate" contract-gate.log; then
            echo "::error::contract gate skipped instead of running — CATALYRST_*_TEST_PG unreachable"
            exit 1
          fi

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  nix-build:
    name: nix build .#catalyrst
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix build .#catalyrst --no-link --print-build-logs
