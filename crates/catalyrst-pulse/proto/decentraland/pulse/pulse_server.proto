syntax = "proto3";

package decentraland.pulse;

import "decentraland/common/options.proto";
import "decentraland/pulse/pulse_shared.proto";

message HandshakeResponse {
  bool success = 1;
  optional string error = 2;
  // The capability bitmask this server supports, advertised on every response so a client learns which features were negotiated.
  uint32 protocol_features = 3;
  bytes application_relay_nonce = 4;
}

message PulseV4Challenge {
  bytes request_id = 1;
  bytes session_id = 2;
  uint64 connection_epoch = 3;
  bytes challenge_id = 4;
  bytes challenge = 5;
  string audience = 6;
  string issuer = 7;
  bytes process_incarnation = 8;
  bytes peer_binding = 9;
  int64 expires_at_ms = 10;
  repeated string negotiated_capabilities = 11;
  PulseV4Limits limits = 12;
}

message PulseV4Result {
  bytes request_id = 1;
  bytes session_id = 2;
  uint64 connection_epoch = 3;
  bytes idempotency_key = 4;
  bool success = 5;
  PulseV4ErrorCode error_code = 6;
  PulseV4RetryClass retry = 7;
  string public_detail = 8;
  repeated string negotiated_capabilities = 9;
  PulseV4Limits limits = 10;
  bytes application_relay_nonce = 11;
}

message PlayerProfileVersionsAnnounced {
  uint32 subject_id = 1;
  int32 version = 2;
}

message PlayerStateDeltaTier0 {
  uint32 subject_id = 1;

  uint32 baseline_seq = 2;
  uint32 new_seq = 3;
  uint32 server_tick = 4;

  optional int32 parcel_index = 5;

  optional uint32 position_x = 6 [(decentraland.common.quantized) = { min:  0,  max:   16, bits: 8 }];

  optional uint32 position_y = 7 [(decentraland.common.quantized) = { min:  0,  max:   200, bits: 13 }];

  optional uint32 position_z = 8 [(decentraland.common.quantized) = { min:  0,  max:   16, bits: 8 }];

  // Power-law quantized: sign bit + 7-bit magnitude curve over [-50, 50]. Zero is exactly
  // representable and pow=2 concentrates resolution at low speeds.
  optional uint32 velocity_x = 9 [(decentraland.common.quantized_power) = { max: 50, pow: 2, bits: 8 }];
  optional uint32 velocity_y = 10 [(decentraland.common.quantized_power) = { max: 50, pow: 2, bits: 8 }];
  optional uint32 velocity_z = 11 [(decentraland.common.quantized_power) = { max: 50, pow: 2, bits: 8 }];

  optional uint32 rotation_y = 12 [(decentraland.common.quantized) = { min:  0,  max:   360.0, bits: 7 }];
  optional uint32 movement_blend = 13 [(decentraland.common.quantized) = { min:  0,  max:   3, bits: 5 }];
  optional uint32 slide_blend = 14 [(decentraland.common.quantized) = { min:  0,  max:   1, bits: 4 }];
  optional uint32 head_yaw = 15 [(decentraland.common.quantized) = { min:  0,  max:   360.0, bits: 7 }];
  optional uint32 head_pitch = 16 [(decentraland.common.quantized) = { min:  0,  max:   360.0, bits: 7 }];

  optional uint32 state_flags = 17;
  optional GlideState glide_state = 18;

  optional int32 jump_count = 19;

  optional uint32 point_at_x = 20 [(decentraland.common.quantized) = { min: -3000.0, max: 3000.0, bits: 17 }];
  optional uint32 point_at_y = 21 [(decentraland.common.quantized) = { min:     0.0, max:  200.0, bits:  7 }];
  optional uint32 point_at_z = 22 [(decentraland.common.quantized) = { min: -3000.0, max: 3000.0, bits: 17 }];
}

message PlayerStateFull {
  uint32 subject_id = 1;
  uint32 sequence = 2;
  uint32 server_tick = 3;
  PlayerState state = 4;
}

// Protocol-version-1 (scheme C) batched egress: one message carries every due per-observer delta
// for a tick. Still a valid protobuf message; only `payload`'s internal bit-layout is out-of-band
// (MSB-first bit-packing, see `crate::batch`). `subject_count` is authoritative for the decode loop
// (a trailing pad byte is ambiguous with a zero-valued element).
message PlayerStateDeltaBatch {
  uint32 server_tick = 1;
  uint32 subject_count = 2;
  bytes payload = 3;
}

message PlayerJoined {
  string user_id = 1;
  int32 profile_version = 2;
  PlayerStateFull state = 3;
  string realm = 4;
}

message PlayerLeft {
  uint32 subject_id = 1;
}

enum EmoteStopReason {
  COMPLETED = 0;
  CANCELLED = 1;
}

message EmoteStarted {
  uint32 subject_id = 1;
  uint32 sequence = 2;
  uint32 server_tick = 3;
  string emote_id = 4;
  PlayerState player_state = 5;
  optional int32 mask = 6;
}

message EmoteStopped {
  uint32 subject_id = 1;
  uint32 server_tick = 2;
  EmoteStopReason reason = 3;
  uint32 sequence = 4;
  PlayerState player_state = 5;
}

message TeleportPerformed {
  uint32 subject_id = 1;
  uint32 sequence = 2;
  uint32 server_tick = 3;
  PlayerState state = 4;
  string realm = 5;
}

message ServerMessage {
  oneof message {
      HandshakeResponse handshake = 1;
      PlayerStateFull player_state_full = 2;
      PlayerStateDeltaTier0 player_state_delta = 3;
      PlayerJoined player_joined = 4;
      PlayerLeft player_left = 5;
      PlayerProfileVersionsAnnounced player_profile_version_announced = 6;
      EmoteStarted emote_started = 7;
      EmoteStopped emote_stopped = 8;
      TeleportPerformed teleported = 9;
      // Batched deltas. Sent only to peers that negotiated the FEATURE_DELTA_BATCH capability bit;
      // peers without it keep receiving per-message player_state_delta (arm 3). Arm 10 does not
      // collide with bevy PR 919, whose ServerMessage oneof uses arms 1 through 9 only.
      PlayerStateDeltaBatch player_state_delta_batch = 10;
      PlayerStateDeltaBatch player_state_delta_batch_baseline = 11;
      ApplicationJoinResult application_join_result = 12;
      ApplicationPeerJoined application_peer_joined = 13;
      ApplicationPeerLeft application_peer_left = 14;
      ApplicationData application_data = 15;
      ApplicationSendFailed application_send_failed = 16;
      PulseV4Challenge v4_challenge = 20;
      PulseV4Result v4_result = 21;
  }
}

message ApplicationPeer {
  uint32 peer_id = 1;
  string identity = 2;
  optional bool is_guest = 3;
}

enum ApplicationErrorCode {
  APPLICATION_OK = 0;
  APPLICATION_INVALID = 1;
  APPLICATION_NOT_AUTHORIZED = 2;
  APPLICATION_LIMIT = 3;
  APPLICATION_UNAVAILABLE = 4;
}

message ApplicationJoinResult {
  uint32 request_id = 1;
  uint32 room_id = 2;
  uint32 self_id = 3;
  uint32 max_payload_bytes = 4;
  repeated ApplicationPeer peers = 5;
  ApplicationErrorCode error = 6;
  uint32 max_unreliable_payload_bytes = 7;
  uint32 roster_version = 8;
}

message ApplicationPeerJoined {
  uint32 room_id = 1;
  ApplicationPeer peer = 2;
  uint32 roster_version = 3;
}

message ApplicationPeerLeft {
  uint32 room_id = 1;
  uint32 peer_id = 2;
  uint32 roster_version = 3;
}

message ApplicationSendFailed {
  uint32 room_id = 1;
  repeated string identities = 2;
  bytes payload = 3;
}

message ApplicationData {
  uint32 room_id = 1;
  uint32 sender_id = 2;
  bytes payload = 3;
}
