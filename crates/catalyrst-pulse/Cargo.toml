[package]
name = "catalyrst-pulse"
version = "0.31.0"
edition = "2021"
description = "Pulse real-time social/MMO server over ENet (port of decentraland/Pulse): sessions, rooms, presence, message routing."

[lib]
path = "src/lib.rs"

[features]
default = ["nats"]
# Exposes the in-process fuzzing surface (`fuzz` module helpers) for the `fuzz/` cargo-fuzz
# target. The proptest suite in that module runs under `cfg(test)` without this feature.
fuzzing = []
# The real cluster-feed publisher. The trait, the fake and the whole tracker build without it, so
# a build with no broker client still derives clusters and reports metrics.
nats = ["dep:async-nats"]

[[bin]]
name = "catalyrst-pulse"
path = "src/main.rs"

[dependencies]
catalyrst-types = { workspace = true }
catalyrst-crypto = { workspace = true }
catalyrst-envcfg = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
prost = "0.14"
sha2 = { workspace = true }
hmac = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
reqwest = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true, features = ["http-listener"] }
rusty_enet = "0.4"
# Generic Rust WebTransport server (browser front door), built for Pulse: an ENet-shaped byte
# pipe over web-transport-quinn (QUIC/HTTP3). Pulse channel semantics live in `transport::webtransport`.
web_transport = { git = "https://github.com/decentraland/rust-web-transport", rev = "c5416501f6ffc4a11303980f9811426ae34c77ef" }
# Pinned to the version catalyrst-fed already resolves, so one broker client builds for the tree.
async-nats = { version = "0.50", optional = true }
# The bounded read-only lookup subscription also consumes a stream in production.
futures-util = { version = "0.3", default-features = false }
getrandom = "0.4"

[dev-dependencies]
web-transport-quinn = "0.11"
url = { workspace = true }
catalyrst-testgate = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }
alloy = { workspace = true }
# WebTransport loopback integration test: self-signed dev cert + its SHA-256 for the client to pin.
rcgen = "0.14"
# In-gate property fuzzing of the packet-handling path (upstream Fuzzer/ strategies, CI-native).
proptest = "1"

[build-dependencies]
prost-build = "0.14"
protox = "0.9"
