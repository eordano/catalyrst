[package]
name = "catalyrst-comms"
version = "0.31.0"
edition = "2021"
description = "Rust port of decentraland/comms-gatekeeper -- LiveKit token minting, scene bans, voice chat, Cast 2.0. Port 5138."

[package.metadata.generated]
gate = "sites/scripts/gen-ts-check.sh"
ts-bindings = "ui3/src/generated/catalyst/comms"

[[bin]]
name = "catalyrst-comms"
path = "src/main.rs"

[dependencies]
catalyrst-authenticated-principal = { workspace = true }
catalyrst-livekit = { workspace = true }
# The Pulse cluster feed's wire types (PeerClusterChange, and the legacy IslandChangedMessage this
# service re-emits). A path dep rather than a second vendored proto tree: the two ends of the feed
# must never drift, and catalyrst-pulse owns the vendored copies. Default features off: the broker
# client this crate dials is its own, below.
catalyrst-pulse = { path = "../catalyrst-pulse", default-features = false }
catalyrst-db = { workspace = true }
catalyrst-types = { workspace = true, features = ["sqlx"] }
catalyrst-crypto = { workspace = true }
catalyrst-envcfg = { workspace = true }
catalyrst-commons = { workspace = true, features = ["cache", "worker"] }
tokio-util = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
sqlx = { workspace = true, features = ["uuid"] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
async-trait = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
prost = "0.14"
# Pinned to the version catalyrst-fed and catalyrst-pulse already resolve, so one broker client
# builds for the tree.
async-nats = { version = "0.50", optional = true }
hex = "0.4"
sha2 = { workspace = true }
hmac = "0.13"
base64 = "0.23"
openmls = "0.9"
openmls_rust_crypto = "0.6"
openmls_traits = "0.6"
tls_codec = "0.5"
ts-rs = { workspace = true, optional = true }

[features]
default = ["nats"]
ts = ["dep:ts-rs"]
# The real broker client. The bus trait, the in-process fake and the whole cluster subscriber build
# without it, so a build with no broker client still compiles and starts.
nats = ["dep:async-nats"]

[dev-dependencies]
tracing-subscriber = { workspace = true }
tokio-tungstenite = { workspace = true }
catalyrst-pulse = { path = "../catalyrst-pulse", default-features = false, features = ["nats"] }
catalyrst-contract-gate = { workspace = true }
catalyrst-testgate = { workspace = true }
tower = { workspace = true, features = ["util"] }
# `test-util` powers the paused-clock tests (TTL expiry, the access cache). It arrives
# transitively through async-nats today, so without this entry the test target stops compiling the
# moment the broker client is dropped or a --no-default-features test run is attempted.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
openmls_basic_credential = "0.6"
# `macros`/`migrate` power the `#[sqlx::test(migrations = ...)]` DB regression
# tests (fed_instance_identity.rs); the production dep only needs `uuid`.
sqlx = { workspace = true, features = ["macros", "migrate", "uuid"] }

[[example]]
name = "mls_client"
path = "examples/mls_client.rs"
