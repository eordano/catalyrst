[package]
name = "catalyrst-commons"
version = "0.24.1"
edition = "2021"
description = "Shared building blocks for catalyrst services: TTL caches, hardened HTTP client + SSRF guards, and periodic / LISTEN-NOTIFY workers"

[features]
default = []
cache = ["dep:tokio", "dep:dashmap"]
http = ["dep:tokio", "dep:reqwest", "dep:url", "dep:anyhow", "dep:futures", "dep:chrono"]
worker = ["dep:tokio", "dep:tokio-util", "dep:futures"]
pg = ["worker", "dep:sqlx"]

[dependencies]
tracing = { workspace = true }
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
dashmap = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
url = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
chrono = { workspace = true }
http = "1"
