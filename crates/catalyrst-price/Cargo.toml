[package]
name = "catalyrst-price"
version = "0.24.0"
edition = "2021"
description = "Thin serving layer for api.coingecko.com (price-feed): GET /api/v3/simple/price over the mana_price archive DB"

[[bin]]
name = "catalyrst-price"
path = "src/main.rs"

[dependencies]
catalyrst-commons = { workspace = true, features = ["http", "worker"] }
catalyrst-db = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
catalyrst-envcfg = { workspace = true }
