[package]
name = "catalyrst-credits"
version = "0.14.5"
edition = "2021"
description = "Rust port of credits.decentraland.org (Marketplace Credits program API): enrollment, seasons/weeks/goals, per-wallet progress, captcha-gated claims. SignedFetch (AuthChain) auth via catalyrst-crypto."

[package.metadata.generated]
gate = "sites/scripts/gen-ts-check.sh"
ts-bindings = "ui3/src/generated/catalyst/credits"

[[bin]]
name = "catalyrst-credits"
path = "src/main.rs"

[dependencies]
catalyrst-types = { workspace = true }
catalyrst-crypto = { workspace = true }
catalyrst-envcfg = { workspace = true }
catalyrst-db = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
reqwest = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = "0.4"
alloy-primitives = "1"
ts-rs = { workspace = true, optional = true }

[features]
ts = ["dep:ts-rs"]

[dev-dependencies]
catalyrst-testgate = { workspace = true }
alloy = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
