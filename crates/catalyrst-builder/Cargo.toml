[package]
name = "catalyrst-builder"
version = "0.31.0"
edition = "2021"
description = "Decentraland Builder API: asset catalog, wearable drafts and verified collection publication"

[package.metadata.generated]
gate = "sites/scripts/gen-ts-check.sh"
ts-bindings = "ui3/src/generated/catalyst/builder"

[[bin]]
name = "catalyrst-builder"
path = "src/main.rs"

[dependencies]
alloy = { workspace = true, features = ["sol-types"] }
catalyrst-types = { workspace = true, features = ["sqlx"] }
catalyrst-crypto = { workspace = true }
catalyrst-hashing = { workspace = true }
catalyrst-envcfg = { workspace = true }
catalyrst-db = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
reqwest = { workspace = true }
sqlx = { workspace = true, features = ["uuid"] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true, features = ["serde"] }
ts-rs = { workspace = true, optional = true }

[features]
ts = ["dep:ts-rs"]

[dev-dependencies]
catalyrst-contract-gate = { workspace = true }
