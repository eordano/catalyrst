[package]
name = "catalyrst-social-service"
version = "0.18.2"
edition = "2021"
description = "Rust port of decentraland/social-service-ea: community REST routes (authority-chain federation) plus the Decentraland-RPC WebSocket service for friends, blocks, mutes, private/community voice, sharing one communities database and one migration history."

[package.metadata.generated]
gate = "sites/scripts/gen-ts-check.sh"
ts-bindings = "ui3/src/generated/catalyst/communities"
openapi = "ui3/src/generated/catalyst/openapi/communities.openapi.json"

[[bin]]
name = "catalyrst-communities"
path = "src/bin/catalyrst-communities.rs"

[[bin]]
name = "catalyrst-social-rpc"
path = "src/bin/catalyrst-social-rpc.rs"
required-features = ["rpc"]

[[bin]]
name = "social-probe"
path = "src/bin/social-probe.rs"
required-features = ["probe"]

[[test]]
name = "friends_blocks"
required-features = ["rpc"]

[[test]]
name = "private_voice_busy"
required-features = ["rpc"]

[[test]]
name = "ws_handshake"
required-features = ["rpc"]

[features]
default = []
nats = ["catalyrst-fed/nats"]
ts = ["dep:ts-rs"]
rpc = [
    "dep:catalyrst-drpc",
    "dep:prost",
    "dep:prost-types",
    "dep:dashmap",
    "dep:async-trait",
    "dep:futures",
    "axum/ws",
]
upstream = ["rpc", "catalyrst-drpc/client", "catalyrst-drpc/tungstenite-rustls"]
probe = ["upstream"]

[dependencies]
catalyrst-storage = { workspace = true }
catalyrst-db = { workspace = true }
catalyrst-types = { workspace = true, features = ["openapi"] }
catalyrst-envcfg = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
catalyrst-authenticated-principal = { workspace = true }
catalyrst-fed = { workspace = true }
catalyrst-crypto = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
sqlx = { workspace = true, features = ["uuid"] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true, features = ["serde"] }
sha2 = { workspace = true }
hex = "0.4"
multer = "3"
futures-util = "0.3"
unicode-normalization = "0.1"
icu_properties = "2"
parking_lot = { workspace = true }
reqwest = { workspace = true }
ts-rs = { workspace = true, optional = true }
catalyrst-drpc = { workspace = true, optional = true }
prost = { version = "0.14", optional = true }
prost-types = { version = "0.14", optional = true }
dashmap = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
futures = { workspace = true, optional = true }

[dev-dependencies]
catalyrst-testgate = { workspace = true }
alloy = { workspace = true }
catalyrst-contract-gate = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
rand = "0.10"
reqwest = { workspace = true }
tokio-tungstenite = "0.30"

[build-dependencies]
catalyrst-drpc = { workspace = true, features = ["codegen"] }
prost-build = "0.14"

[package.metadata.cargo-machete]
ignored = ["prost", "prost-types"]

[[example]]
name = "smoke_create"
path = "examples/smoke_create.rs"
