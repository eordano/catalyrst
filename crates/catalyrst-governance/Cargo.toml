[package]
name = "catalyrst-governance"
version = "0.15.0"
edition = "2021"
description = "Governance API component for the catalyrst stack"

[package.metadata.generated]
gate = "sites/scripts/gen-ts-check.sh"
ts-bindings = "ui3/src/generated/catalyst/governance"

[[bin]]
name = "catalyrst-governance"
path = "src/main.rs"

[dependencies]
catalyrst-db = { workspace = true }
catalyrst-envcfg = { workspace = true }
catalyrst-crypto = { workspace = true }
alloy = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
reqwest = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true }

[features]
ts = ["dep:ts-rs"]
