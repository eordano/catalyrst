[package]
name = "catalyrst-archipelago"
version = "0.29.0"
edition = "2021"
description = "Rust port of decentraland/archipelago-workers -- ws-connector and stats over the Pulse cluster feed. Port 5139."

[[bin]]
name = "catalyrst-archipelago"
path = "src/main.rs"

[dependencies]
catalyrst-livekit = { workspace = true }
catalyrst-db = { workspace = true }
catalyrst-types = { workspace = true, features = ["sqlx"] }
catalyrst-crypto = { workspace = true }
catalyrst-envcfg = { workspace = true }
catalyrst-commons = { workspace = true, features = ["cache", "worker"] }
tokio = { workspace = true }
tokio-util = { workspace = true }
axum = { workspace = true, features = ["ws"] }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
parking_lot = { workspace = true }
dashmap = { workspace = true }
futures = { workspace = true }
sqlx = { workspace = true }
prost = "0.14"
rand = "0.10"
toml = "1.1"
async-nats = "0.50"

[build-dependencies]
prost-build = "0.14"
protox = "0.9"

[dev-dependencies]
catalyrst-testgate = { workspace = true }
catalyrst-contract-gate = { workspace = true }
alloy = { workspace = true }
base64 = "0.23"
hmac = "0.13"
sha2 = "0.11"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-tungstenite = "0.30"
