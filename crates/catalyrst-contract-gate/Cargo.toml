[package]
name = "catalyrst-contract-gate"
version = "0.15.3"
edition = "2021"
description = "Route-level OpenAPI contract-test harness for the pilot services: spec-driven request runner, response schema validation, coverage ledger, scratch-schema PG setup"

[dependencies]
axum = { workspace = true }
tower = { workspace = true, features = ["util"] }
serde_json = { workspace = true }
sqlx = { workspace = true }
jsonschema = { version = "0.49", default-features = false }
catalyrst-crypto = { workspace = true }
catalyrst-testgate = { workspace = true }
chrono = { workspace = true }
