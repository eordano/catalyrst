[package]
name = "catalyrst-economy"
version = "0.15.5"
edition = "2021"
description = "Rust port of decentraland/transactions-server (transactions-api.decentraland.org) — meta-transaction relay over the marketplace_squid DB"

[package.metadata.generated]
gate = "sites/scripts/gen-ts-check.sh"
ts-bindings = "ui3/src/generated/catalyst/economy"

[[bin]]
name = "catalyrst-economy"
path = "src/main.rs"

[dependencies]
catalyrst-envcfg = { workspace = true }
catalyrst-types = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
reqwest = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
alloy = { workspace = true }
parking_lot = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
ts-rs = { workspace = true, optional = true }

[features]
ts = ["dep:ts-rs"]

[dev-dependencies]
catalyrst-testgate = { workspace = true }
