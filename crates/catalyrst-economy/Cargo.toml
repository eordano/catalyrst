[package]
name = "catalyrst-economy"
version = "0.24.0"
edition = "2021"
description = "Rust port of decentraland/transactions-server (transactions-api.decentraland.org) -- meta-transaction relay over the marketplace_squid DB"

[package.metadata.generated]
gate = "sites/scripts/gen-ts-check.sh"
ts-bindings = "ui3/src/generated/catalyst/economy"

[[bin]]
name = "catalyrst-economy"
path = "src/main.rs"

[dependencies]
catalyrst-authenticated-principal = { workspace = true }
catalyrst-commons = { workspace = true, features = ["cache", "worker"] }
catalyrst-crypto = { workspace = true }
catalyrst-db = { workspace = true }
catalyrst-envcfg = { workspace = true }
catalyrst-types = { workspace = true, features = ["sqlx"] }
tokio = { workspace = true }
tokio-util = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
alloy = { workspace = true, features = ["reqwest-rustls-tls", "provider-http", "rpc-types-eth", "sol-types"] }
uuid = { workspace = true, features = ["v4"] }
ts-rs = { workspace = true, optional = true }

[features]
ts = ["dep:ts-rs"]

[dev-dependencies]
catalyrst-testgate = { workspace = true }
catalyrst-contract-gate = { workspace = true }
