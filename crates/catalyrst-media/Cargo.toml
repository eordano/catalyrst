[package]
name = "catalyrst-media"
version = "0.24.0"
edition = "2021"
description = "Rust port of decentraland/autotranslate-server (autotranslate-server.decentraland.org): LibreTranslate-compatible POST /translate (single + batch), postgres TTL cache."

[[bin]]
name = "catalyrst-media"
path = "src/main.rs"

[dependencies]
catalyrst-commons = { workspace = true, features = ["http"] }
catalyrst-db = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
catalyrst-envcfg = { workspace = true }
catalyrst-types = { workspace = true, features = ["sqlx"] }
async-trait = { workspace = true }
sha2 = { workspace = true }
