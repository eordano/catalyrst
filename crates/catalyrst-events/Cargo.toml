[package]
name = "catalyrst-events"
version = "0.14.5"
edition = "2021"
description = "Rust port of decentraland/events (REST API for events.decentraland.org), HTTP-snapshot federation per docs/federation/events.md"

[package.metadata.generated]
gate = "sites/scripts/gen-ts-check.sh"
ts-bindings = "ui3/src/generated/catalyst/events"
openapi = "ui3/src/generated/catalyst/openapi/events.openapi.json"

[[bin]]
name = "catalyrst-events"
path = "src/main.rs"

[dependencies]
catalyrst-storage = { workspace = true }
catalyrst-db = { workspace = true }
catalyrst-types = { workspace = true, features = ["openapi"] }
catalyrst-fed = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
catalyrst-crypto = { workspace = true }
catalyrst-envcfg = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
sha2 = { workspace = true }
url = { workspace = true }
hex = "0.4"
ts-rs = { workspace = true, optional = true }

[features]
ts = ["dep:ts-rs"]
nats = ["catalyrst-fed/nats"]

[dev-dependencies]
alloy = { workspace = true }
rand = "0.10"
catalyrst-contract-gate = { workspace = true }
